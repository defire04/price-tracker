home.text=Привет! Я слежу за ценами и наличием товаров на Intertop.\n\nЧто делаем?
help.text=Как это работает:\n1. Нажмите «➕ Добавить отслеживание» и пришлите ссылку на товар с intertop.ua\n2. Выберите размер и события: появление в наличии, снижение/рост цены, скидка до порога\n3. Я проверяю сайт несколько раз в день и напишу, когда что-то изменится\n\nОтслеживания живут в «📋 Мои отслеживания» — там их можно переименовать или остановить.

