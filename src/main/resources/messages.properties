home.text=Привіт! Я стежу за цінами та наявністю товарів на Intertop.\n\nЩо робимо?
help.text=Як це працює:\n1. Натисніть «➕ Додати відстеження» і надішліть посилання на товар з {0}\n2. Оберіть розмір і події: поява в наявності, зниження/зростання ціни, знижка до порогу\n3. Я перевіряю сайт кілька разів на день і повідомлю, коли щось зміниться\n\nВідстеження живуть у «📋 Мої відстеження» — там їх можна перейменувати або зупинити.

