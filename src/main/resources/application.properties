spring.application.name=price-tracker

# PostgreSQL - credentials from env, no defaults (.env in the project root is auto-loaded by springboot4-dotenv)
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - schema is managed by Hibernate (pet project, no migrations yet)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC

# Telegram bot
tracker.bot.enabled=true
tracker.bot.token=${TELEGRAM_BOT_TOKEN:}

# Price check schedule: N times a day = N hours in the cron expression
tracker.check.cron=${TRACKER_CHECK_CRON:0 0 8,20 * * *}
tracker.check.jitter-min-ms=3000
tracker.check.jitter-max-ms=10000

# Outgoing HTTP to shops
tracker.http.user-agent=Mozilla/5.0 (X11; Linux x86_64; rv:130.0) Gecko/20100101 Firefox/130.0
tracker.http.timeout-ms=15000

# Actuator - health only
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
