spring.application.name=price-tracker

# PostgreSQL - credentials from env, no defaults (.env in the project root is auto-loaded by springboot4-dotenv)
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - schema is managed by Liquibase, Hibernate only validates the mapping
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC

# Telegram bot
tracker.bot.enabled=true
tracker.bot.token=${TELEGRAM_BOT_TOKEN:}
# Admin chat gets parser failure alerts and the admin menu; 0 disables both
tracker.bot.admin-chat-id=${TELEGRAM_ADMIN_CHAT_ID:0}

# Live product URLs for the admin "test parsers" button, one per site
tracker.test-urls.INTERTOP=https://intertop.ua/uk-ua/product/sneakers-respect-6185193/
tracker.test-urls.ANSWEAR=https://answear.ua/ru/p/bavovnyane-polo-hugo-dereso222-kolir-chornyj-z-aplikatsiieyu-838304
tracker.test-urls.STRADIVARIUS=https://www.stradivarius.com/ua/%D0%B4%D0%BE%D0%B2%D0%B3%D0%B0-%D1%81%D1%82%D1%80%D1%83%D0%BC%D0%BB%D0%B8%D0%B2%D0%B0-%D1%81%D1%83%D0%BA%D0%BD%D1%8F-%D0%B7-%D0%B2%D1%96%D0%B4%D0%BA%D1%80%D0%B8%D1%82%D0%BE%D1%8E-%D1%81%D0%BF%D0%B8%D0%BD%D0%BE%D1%8E-l06352705

# Price check schedule: N times a day = N hours in the cron expression
tracker.check.cron=${TRACKER_CHECK_CRON:0 0 8,20 * * *}
tracker.check.jitter-min-ms=3000
tracker.check.jitter-max-ms=10000

# Outgoing HTTP to shops
# Chrome UA: must match the Playwright chromium fingerprint, or Cloudflare gets suspicious
tracker.http.user-agent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36
tracker.http.timeout-ms=30000

# i18n - uk is the default bundle, never fall back to the server OS locale
spring.messages.fallback-to-system-locale=false

# Actuator - health only
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
