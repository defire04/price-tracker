home.text=Hi! I track prices and stock of Intertop products.\n\nWhat shall we do?
help.text=How it works:\n1. Tap "➕ Add tracking" and send a product link from intertop.ua\n2. Pick a size and events: back in stock, price drop/increase, discount threshold\n3. I check the site a few times a day and message you when something changes\n\nYour trackings live in "📋 My trackings" — rename or stop them there.

